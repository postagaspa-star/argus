<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Argus</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root {
    --sfondo: #0c0e11;
    --pannello: #12151a;
    --bordo: #222831;
    --testo: #d7dde4;
    --tenue: #7d8794;
    --accento: #7fd1a8;
    --errore: #ff9b8a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--sfondo); color: var(--testo);
    font: 15px/1.5 "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
    overflow: hidden; user-select: text;
  }
  #storia { position: absolute; inset: 0 0 46px 0; overflow-y: auto; padding: 12px 16px 8px; }
  .riga { white-space: pre-wrap; word-break: break-word; margin: 0 0 2px; }
  .tu { color: var(--tenue); }
  .tu::before { content: "> "; color: var(--accento); }
  .risp { margin-bottom: 10px; }
  .err { color: var(--errore); }
  .info { color: var(--tenue); }
  #barra {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46px;
    border-top: 1px solid var(--bordo); display: flex; align-items: center; padding: 0 16px; background: var(--pannello);
  }
  #barra .prompt { color: var(--accento); margin-right: 10px; }
  #riga { flex: 1; background: transparent; border: 0; outline: 0; color: var(--testo); font: inherit; caret-color: var(--accento); }
  #riga:disabled { color: var(--tenue); }
  #foto {
    position: absolute; inset: 0 0 46px 0; background: var(--sfondo); display: none;
    padding: 12px 16px; overflow-y: auto;
  }
  #foto.aperto { display: block; }
  #foto .titolo { color: var(--accento); }
  #anteprima { display: flex; gap: 14px; margin: 10px 0; align-items: flex-start; }
  video { width: 320px; height: 240px; background: #000; border: 1px solid var(--bordo); object-fit: cover; }
  #miniature { display: flex; flex-wrap: wrap; gap: 6px; max-width: 360px; }
  #miniature img { width: 64px; height: 48px; object-fit: cover; border: 1px solid var(--bordo); }
  .pulsanti { display: flex; gap: 10px; margin-top: 8px; }
  button {
    font: inherit; color: var(--testo); background: var(--pannello); border: 1px solid var(--bordo);
    padding: 4px 12px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accento); }
  button:disabled { color: var(--tenue); cursor: default; }
  #trascina {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    border: 2px dashed var(--accento); background: rgba(12,14,17,.92); color: var(--accento); font-size: 18px;
  }
  #trascina.su { display: flex; }
</style>
</head>
<body>
<div id="storia" aria-live="polite"></div>

<div id="foto" role="dialog" aria-label="Foto">
  <div class="titolo" id="fotoTitolo"></div>
  <div class="info" id="fotoConsiglio"></div>
  <div id="anteprima">
    <video id="video" autoplay playsinline muted></video>
    <div>
      <div id="contatore"></div>
      <div id="miniature"></div>
    </div>
  </div>
  <div class="info" id="fotoStato"></div>
  <div class="pulsanti">
    <button id="scatta">Scatta (Spazio)</button>
    <button id="manda" disabled>Manda (Invio)</button>
    <button id="annulla">Annulla (Esc)</button>
  </div>
  <div class="info" style="margin-top:8px">Puoi anche trascinare qui dentro le foto.</div>
</div>

<div id="barra">
  <span class="prompt">&gt;</span>
  <input id="riga" autocomplete="off" spellcheck="false" aria-label="Comando" placeholder="scrivi un comando (aiuto per l'elenco)">
</div>

<div id="trascina">Lascia qui le foto</div>

<script>
"use strict";
const host = window.chrome && window.chrome.webview;
const $ = (id) => document.getElementById(id);
const storia = $("storia"), riga = $("riga");
const passati = [];
let indicePassati = -1;
let inAttesa = false;
let foto = null;   // { tipo, nome, scatti, immagini: [dataUrl], flusso, automatico }

function manda(m) { if (host) host.postMessage(m); }

function aggiungi(classe, testo) {
  const p = document.createElement("div");
  p.className = "riga " + classe;
  p.textContent = testo;
  storia.appendChild(p);
  storia.scrollTop = storia.scrollHeight;
}

aggiungi("info", "Argus. Scrivi un comando e premi Invio (aiuto per l'elenco). Esc nasconde la finestra.");

function attesa(si) {
  inAttesa = si;
  riga.disabled = si;
  if (!si) riga.focus();
}

riga.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    const testo = riga.value.trim();
    if (!testo || inAttesa) return;
    aggiungi("tu", testo);
    passati.push(testo);
    indicePassati = passati.length;
    riga.value = "";
    attesa(true);
    manda({ tipo: "comando", testo });
  } else if (e.key === "ArrowUp") {
    if (passati.length === 0) return;
    e.preventDefault();
    indicePassati = Math.max(0, indicePassati - 1);
    riga.value = passati[indicePassati] || "";
  } else if (e.key === "ArrowDown") {
    if (passati.length === 0) return;
    e.preventDefault();
    indicePassati = Math.min(passati.length, indicePassati + 1);
    riga.value = passati[indicePassati] || "";
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    e.preventDefault();
    if (foto) { chiudiFoto("Foto annullate."); return; }
    manda({ tipo: "nascondi" });
    return;
  }
  // Su un pulsante Spazio e Invio li gestisce il pulsante stesso (niente doppio scatto).
  const suPulsante = document.activeElement && document.activeElement.tagName === "BUTTON";
  if (foto && !foto.inviate && !suPulsante && document.activeElement !== riga) {
    if (e.key === " ") { e.preventDefault(); scatta(); }
    else if (e.key === "Enter") { e.preventDefault(); invia(); }
  }
});

if (host) {
  host.addEventListener("message", (e) => {
    const m = e.data || {};
    if (m.tipo === "mostrato") {
      if (!foto) riga.focus();
    } else if (m.tipo === "nascosto") {
      if (foto && !foto.inviate) chiudiFoto("Foto annullate.");
    } else if (m.tipo === "risposta") {
      aggiungi(m.ok === false ? "risp err" : "risp", m.testo || "");
      if (foto && foto.inviate) chiudiFoto(null);
      attesa(false);
      if (m.chiede_foto) apriFoto(m.chiede_foto);
    }
  });
}

// ------------------------------------------------------------------ foto (lb, qd, vs, tf)

async function apriFoto(cf) {
  const scatti = Math.max(1, Math.min(20, Number(cf.scatti) || 6));
  foto = { tipo: String(cf.tipo || ""), nome: cf.nome || null, scatti, immagini: [], flusso: null, automatico: cf.tipo === "vs", inviate: false };
  $("fotoTitolo").textContent = "Foto: " + scatti + " scatti" + (foto.nome ? " per «" + foto.nome + "»" : "");
  $("fotoConsiglio").textContent = cf.consiglio || "";
  $("fotoStato").textContent = "Apro la webcam...";
  $("miniature").innerHTML = "";
  $("foto").classList.add("aperto");
  riga.disabled = true;
  aggiornaContatore();
  try {
    foto.flusso = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    $("video").srcObject = foto.flusso;
    $("fotoStato").textContent = foto.automatico
      ? "Gira piano la testa: scatto da solo una foto al secondo."
      : "Premi Spazio (o Scatta) per ogni foto.";
    if (foto.automatico) scattiAutomatici();
  } catch (err) {
    $("fotoStato").textContent = "Non riesco ad aprire la webcam: trascina qui le foto.";
  }
}

function scattiAutomatici() {
  let conto = 3;
  const f = foto;
  const giro = () => {
    if (foto !== f || f.inviate) return;
    if (conto > 0) { $("fotoStato").textContent = "Pronto? Comincio tra " + conto + "..."; conto--; setTimeout(giro, 1000); return; }
    scatta();
    if (f.immagini.length < f.scatti) setTimeout(giro, 1000);
  };
  giro();
}

function aggiornaContatore() {
  if (!foto) return;
  $("contatore").textContent = "Foto " + foto.immagini.length + " di " + foto.scatti;
  $("manda").disabled = foto.immagini.length === 0;
  $("scatta").disabled = !foto.flusso || foto.immagini.length >= 20;
}

function aggiungiImmagine(dataUrl) {
  if (!foto || foto.immagini.length >= 20) return;
  foto.immagini.push(dataUrl);
  const img = document.createElement("img");
  img.src = dataUrl;
  img.alt = "foto " + foto.immagini.length;
  $("miniature").appendChild(img);
  aggiornaContatore();
  if (foto.immagini.length >= foto.scatti) invia();
}

function scatta() {
  if (!foto || !foto.flusso || foto.inviate) return;
  const v = $("video");
  if (!v.videoWidth) return;
  const c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v, 0, 0);
  aggiungiImmagine(c.toDataURL("image/jpeg", 0.9));
}

function invia() {
  if (!foto || foto.inviate || foto.immagini.length === 0) return;
  foto.inviate = true;
  fermaWebcam();
  $("fotoStato").textContent = "Mando le foto...";
  $("scatta").disabled = true; $("manda").disabled = true;
  attesa(true);
  manda({ tipo: "foto", fototipo: foto.tipo, nome: foto.nome, immagini: foto.immagini });
}

function fermaWebcam() {
  if (foto && foto.flusso) { foto.flusso.getTracks().forEach((t) => t.stop()); foto.flusso = null; }
  $("video").srcObject = null;
}

function chiudiFoto(messaggio) {
  fermaWebcam();
  foto = null;
  $("foto").classList.remove("aperto");
  if (messaggio) aggiungi("info", messaggio);
  attesa(false);
}

$("scatta").addEventListener("click", scatta);
$("manda").addEventListener("click", invia);
$("annulla").addEventListener("click", () => chiudiFoto("Foto annullate."));

// Foto trascinate: si rifanno in JPEG (al massimo 2000 px per lato) così restano sotto gli 8 MB.
function rifaiJpeg(file) {
  return new Promise((ok) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scala = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * scala); c.height = Math.round(img.naturalHeight * scala);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL("image/jpeg", 0.9));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(null); };
    img.src = url;
  });
}

let trascinamenti = 0;
document.addEventListener("dragenter", (e) => { e.preventDefault(); if (foto && !foto.inviate) { trascinamenti++; $("trascina").classList.add("su"); } });
document.addEventListener("dragleave", (e) => { e.preventDefault(); if (--trascinamenti <= 0) { trascinamenti = 0; $("trascina").classList.remove("su"); } });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", async (e) => {
  e.preventDefault();
  trascinamenti = 0;
  $("trascina").classList.remove("su");
  if (!foto || foto.inviate) { aggiungi("info", "Le foto si trascinano dopo un comando lb, qd, vs o tf."); return; }
  const files = Array.from(e.dataTransfer.files || []).filter((f) => /^image\/(jpeg|png)$/.test(f.type));
  if (files.length === 0) { $("fotoStato").textContent = "Servono foto JPEG o PNG."; return; }
  const scatti = foto.scatti;
  foto.scatti = 99; // non mandare a metà mentre arrivano
  for (const f of files) { const d = await rifaiJpeg(f); if (d) aggiungiImmagine(d); }
  if (foto) {
    foto.scatti = scatti;
    aggiornaContatore();
    $("fotoStato").textContent = "Premi Invio (o Manda) per mandare le foto.";
  }
});
</script>
</body>
</html>
